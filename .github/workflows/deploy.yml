name: Deploy VPS

# Deploy manual (workflow_dispatch): faz na VPS o mesmo que o passo 5 da skill
# "deploy" — busca o commit, reconstrói a imagem, aplica migrations e recria o app.
# Precisa dos segredos do repositório (Settings → Secrets and variables → Actions):
#   SSH_HOST  → IP ou host da VPS (179.197.74.90)
#   SSH_USER  → usuário com acesso ao diretório do app e ao grupo docker (deploy)
#   SSH_KEY   → chave privada SSH (a pública já precisa estar em ~/.ssh/authorized_keys)
#   SSH_PORT  → opcional (padrão 22)
# Variável opcional: APP_URL → endereço conferido depois do deploy
# (padrão https://www.diastransporte.site).

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  APP_DIR: /opt/diastransporte-app
  COMPOSE: docker compose -f docker-compose.staging.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Atualizar, migrar e reiniciar
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -euo pipefail <<'REMOTO'
          cd /opt/diastransporte-app
          git fetch -q origin
          git reset -q --hard "${{ github.sha }}"
          docker compose -f docker-compose.staging.yml build app
          docker compose -f docker-compose.staging.yml run --rm -T app node db/migrate.mjs
          docker compose -f docker-compose.staging.yml up -d --no-deps app
          docker image prune -f
          REMOTO

      - name: Conferir se o site responde
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "${{ vars.APP_URL || 'https://www.diastransporte.site' }}"; then
              echo "site respondendo"; exit 0
            fi
            sleep 5
          done
          echo "site não respondeu depois do deploy"; exit 1
