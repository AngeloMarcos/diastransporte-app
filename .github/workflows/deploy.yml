name: Deploy VPS

# Publica na VPS a cada push na main. Segredos necessários no repositório
# (Settings → Secrets and variables → Actions):
#   SSH_HOST  → IP ou host da VPS
#   SSH_USER  → usuário com acesso a /opt/car-fleet-co e ao grupo docker
#   SSH_KEY   → chave privada SSH (a pública já precisa estar em
#               ~/.ssh/authorized_keys do SSH_USER na VPS)
#   SSH_PORT  → opcional (padrão 22)
# Variável opcional (Settings → Secrets and variables → Actions → Variables):
#   APP_URL   → usada só pra conferir se o site respondeu depois do deploy
#
# Este repositório é público, então "git pull" direto na VPS funciona sem
# nenhuma credencial do GitHub (diferente do projeto irmão Dias Transporte,
# que é privado e por isso empacota e manda por scp em vez de dar pull na
# VPS — ver o deploy.yml de lá pra esse caso).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

env:
  APP_DIR: /opt/car-fleet-co

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Atualizar, migrar e reiniciar
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -euo pipefail <<'REMOTO'
          cd ${{ env.APP_DIR }}
          git fetch --all
          git reset --hard origin/main
          # O .env não é versionado (.gitignore) mas restaura da cópia de
          # produção mesmo assim, por segurança — mesmo hábito do projeto
          # irmão Dias Transporte.
          cp "$HOME/.carfleet-env-secrets.bak" .env
          chmod 600 .env
          docker compose build app
          docker compose up -d db
          docker compose run --rm --entrypoint sh app -c 'node db/migrate.mjs'
          docker compose up -d app
          docker image prune -f
          REMOTO

      - name: Conferir se o site responde
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "${{ vars.APP_URL || 'http://179.197.74.90:3001' }}"; then
              echo "site respondendo"; exit 0
            fi
            sleep 5
          done
          echo "site não respondeu depois do deploy"; exit 1
