# STAGING TEMPORARIO da fusao (nao e' o docker-compose.yml oficial do
# repositorio - esse continua representando a topologia de producao real,
# com Caddy, pra Etapa 8). Sem Caddy aqui: publica a porta do app direto,
# pra nao colidir com 80/443 do Dias Transporte real. Ver roteiro em
# C:\Users\angel\.claude\plans\linear-rolling-marble.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dias}
      POSTGRES_USER: ${POSTGRES_USER:-dias_migration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dias_migration} -d ${POSTGRES_DB:-dias}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem ports: publicado só na rede interna. Para pg_dump remoto, use SSH tunnel.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      DATABASE_URL_MIGRATION: ${DATABASE_URL_MIGRATION:-}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      APP_URL: ${APP_URL:?defina APP_URL no .env}
      UPLOADS_DIR: /var/lib/dias-transporte/uploads
      VITE_AUTH_MODE: vps
      PORT: 3000
    volumes:
      - uploads:/var/lib/dias-transporte/uploads
    ports:
      - "3002:3000" # staging temporario, direto por IP (sem Caddy/domínio ainda)
    healthcheck:
      # Sem isso "restart: unless-stopped" só reagia a um crash de verdade
      # (processo morto) — um processo travado mas ainda de pé (ex.: preso
      # numa query que nunca retorna) ficava no ar indefinidamente sem
      # servir nada. wget por ser o único cliente HTTP disponível na imagem
      # node:alpine (sem curl).
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - autoheal=true

  # "restart: unless-stopped" sozinho só reage a um container que morreu de
  # verdade — um container "unhealthy" (healthcheck falhando, processo
  # travado mas de pé) fica parado no compose puro (sem Swarm) até alguém
  # perceber e reiniciar à mão. Este sidecar observa containers com o label
  # autoheal=true e reinicia os que ficarem "unhealthy" — só precisa do
  # socket do Docker, não expõe porta nenhuma.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db:
  uploads:
