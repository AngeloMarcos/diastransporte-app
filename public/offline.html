<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111214" />
    <title>Você está offline — Dias Transporte</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #111214;
        color: #f4f4f5;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 8px;
        object-fit: contain;
      }
      h1 {
        margin: 24px 0 0;
        font-size: clamp(1.5rem, 5vw, 2rem);
        line-height: 1.15;
        letter-spacing: 0.01em;
      }
      p {
        margin: 12px auto 0;
        max-width: 32ch;
        font-size: 0.95rem;
        line-height: 1.55;
        color: #a1a1aa;
      }
      button {
        margin-top: 28px;
        min-height: 44px;
        min-width: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 6px;
        background: #e11d2e;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      small {
        display: block;
        margin-top: 20px;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Dias Transporte" width="72" height="72" decoding="async" />
      <h1>Você está offline</h1>
      <p>
        Verifique sua conexão com a internet. Assim que voltar, esta página carrega normalmente.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
      <small>Dias Transporte — (98) 98150-6268</small>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
