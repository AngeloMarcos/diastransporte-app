# Stack do car-fleet-co na VPS: app + Postgres.
# Copie .env.example para .env e ajuste antes de subir. Mesmo formato do
# projeto irmão Dias Transporte (que já roda assim em produção).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carfleet}
      POSTGRES_USER: ${POSTGRES_USER:-carfleet_migration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carfleet_migration} -d ${POSTGRES_DB:-carfleet}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem ports: publicado só na rede interna. Para pg_dump remoto, use SSH tunnel.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      DATABASE_URL_MIGRATION: ${DATABASE_URL_MIGRATION:-}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      APP_URL: ${APP_URL:?defina APP_URL no .env}
      VITE_AUTH_MODE: vps
      PORT: 3000
      # Integração com o Dias Transporte (Sprint 3 do roteiro "Despacho
      # Unificado"). Vazio = endpoint sempre responde 401 (integração
      # desligada), não impede o resto do app de subir.
      INTEGRACAO_DIAS_TRANSPORTE_TOKEN: ${INTEGRACAO_DIAS_TRANSPORTE_TOKEN:-}
    ports:
      # Publicado direto (sem domínio/proxy ainda - Sprint 5 do roteiro troca
      # isso por Caddy com HTTPS). 3001 pra nao colidir com o Dias Transporte
      # (porta 3000) na mesma VPS. Exige liberar 3001/tcp no ufw.
      - "3001:3000"
    healthcheck:
      # Sem isso "restart: unless-stopped" só reagia a um crash de verdade
      # (processo morto) — um processo travado mas ainda de pé ficava no ar
      # indefinidamente sem servir nada. wget por ser o único cliente HTTP
      # disponível na imagem node:alpine (sem curl).
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - autoheal=true

  # "restart: unless-stopped" sozinho só reage a um container que morreu de
  # verdade — um "unhealthy" (healthcheck falhando, processo travado mas de
  # pé) fica parado no compose puro (sem Swarm) até alguém perceber e
  # reiniciar à mão. Este sidecar observa containers com o label
  # autoheal=true e reinicia os que ficarem "unhealthy" — mesmo padrão do
  # projeto irmão Dias Transporte.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db:
